<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instant Virtual Predictor</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--b:#1167e8;--d:#08204a;--bg:#f4f8ff;--ink:#12223d;--muted:#708097;--ok:#07965d;--bad:#d54141;--gold:#b97800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#07378d,#1788ff);color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{background:transparent;color:#fff;border:0;padding:8px;cursor:pointer}
main{max-width:1180px;margin:auto;padding:24px 16px}.hero{border-radius:24px;background:linear-gradient(135deg,#07378d,#1788ff);color:#fff;padding:38px;margin-bottom:18px;box-shadow:0 15px 40px #0a4ea525}.hero h1{font-size:40px;margin:0 0 10px}.hero p{line-height:1.6;max-width:820px}.card{background:#fff;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 28px #0a204a12}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.two{grid-template-columns:repeat(2,1fr)}.stat{font-size:28px;font-weight:900}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:10px;padding:12px 17px;font-weight:800;cursor:pointer}.blue{background:var(--b);color:#fff}.soft{background:#eaf2ff;color:#145bc4}input,select,textarea{width:100%;padding:12px;border:1px solid #d6e0ef;border-radius:10px;margin:6px 0 12px}.upload{border:2px dashed #87b8ff;padding:26px;border-radius:16px;text-align:center;background:#f8fbff}.preview{max-width:100%;max-height:340px;border-radius:12px;display:none;margin:12px auto}.msg{padding:11px;border-radius:10px;background:#f0f5fc;margin-top:10px}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eaf2ff;color:#145bc4;font-size:11px;font-weight:800;margin:2px}.win{color:var(--ok);font-weight:900}.loss{color:var(--bad);font-weight:900}.pending{color:var(--gold);font-weight:900}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e9eef6;text-align:left;font-size:13px}.hide{display:none!important}.fixture{padding:12px;border:1px solid #e0e8f5;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
@media(max-width:720px){.nav{display:none}.hero h1{font-size:29px}.grid,.two{grid-template-columns:1fr}table{display:block;overflow:auto}}
</style></head><body><header><div class="logo">🔵 INSTANT VIRTUAL PREDICTOR</div><div class="nav"><button onclick="go('home')">Home</button><button onclick="go('dashboard')">Dashboard</button><button onclick="go('history')">History</button><button onclick="go('admin')">Admin</button><button onclick="logout()">Logout</button></div></header><main id="app"></main>
<script>
let S={user:null,settings:null,ai:false,fixtures:[]};const $=x=>document.getElementById(x);
async function api(p,o={}){let r=await fetch(p,{headers:{"Content-Type":"application/json"},...o}),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function boot(){let d=await api("/api/config");S.user=d.user;S.settings=d.settings;S.ai=d.aiEnabled;go(S.user?"dashboard":"home")}
function go(p){if(p==="home")home();else if(p==="dashboard")dashboard();else if(p==="history")history();else if(p==="admin")admin()}
function home(){app.innerHTML=`<section class=hero><h1>Virtual & Instant Football</h1><p>Screenshot → OCR/AI Vision → Fixture extraction → Analysis → Prediction → Verified result history. Odds are kept separate from the analysis engine.</p></section><div class=card><h2>🔐 Login / Register</h2><div class="grid two"><form onsubmit="login(event)"><h3>Login</h3><input id=le type=email placeholder=Email required><input id=lp type=password placeholder=Password required><button class="btn blue">Login</button></form><form onsubmit="reg(event)"><h3>Register</h3><input id=rn placeholder=Name><input id=re type=email placeholder=Email required><input id=rp type=password placeholder=Password required><button class="btn blue">Create account</button></form></div><div id=msg></div></div>`}
async function login(e){e.preventDefault();try{let d=await api("/api/login",{method:"POST",body:JSON.stringify({email:le.value,password:lp.value})});S.user=d.user;go("dashboard")}catch(x){msg.textContent=x.message}}
async function reg(e){e.preventDefault();try{let d=await api("/api/register",{method:"POST",body:JSON.stringify({name:rn.value,email:re.value,password:rp.value})});msg.textContent=d.message}catch(x){msg.textContent=x.message}}
async function logout(){await api("/api/logout",{method:"POST"});S.user=null;go("home")}
function dashboard(){if(!S.user)return home();app.innerHTML=`<section class=hero><h1>Dashboard</h1><p>Account: <b>${S.user.email}</b> · Status: <b>${S.user.active?"ACTIVE":"NOT ACTIVE"}</b></p></section>${!S.user.active?`<div class=card><h2>💳 Subscription: TSh ${Number(S.settings.priceTsh).toLocaleString()}</h2><p>${S.settings.paymentInstructions}</p><p><b>${S.settings.paymentMethod}:</b> ${S.settings.paymentNumber||"Admin hajajaweka namba"} ${S.settings.paymentName?"· "+S.settings.paymentName:""}</p><form onsubmit="pay(event)"><input id=ref placeholder="Transaction reference" required><button class="btn blue">Submit Payment</button></form><div id=paymsg></div></div>`:""}<div class=card><h2>📸 Upload Screenshot</h2><div class=upload><input id=shot type=file accept="image/*"><img id=prev class=preview><button class="btn blue" onclick="ocr()" ${S.user.active?"":"disabled"}>Read Games</button><div id=ocrmsg class=muted>${S.ai?"AI Vision is enabled.":"Browser OCR mode is enabled."}</div></div></div><div class=card><h2>⚽ Games Found</h2><div id=fixtures>${S.fixtures.length?S.fixtures.map((f,i)=>fixture(f,i)).join(""):"Upload screenshot to extract fixtures."}</div></div><div class=card><h2>🤖 Prediction Engine</h2><p class=muted>Prediction uses stored results/statistical history. Odds are not used.</p><form onsubmit="predict(event)"><div class=grid two><div><label>Team A</label><input id=ta required><label>Market</label><select id=market><option>1X2</option><option>Over/Under</option><option>GG/NG</option><option>Double Chance</option></select></div><div><label>Team B</label><input id=tb required><label>Optional: market note</label><input id=note placeholder="e.g. Over 2.5"></div></div><button class="btn blue">Analyze & Save</button></form><div id=predmsg></div></div>`;shot.onchange=()=>{if(shot.files[0]){prev.src=URL.createObjectURL(shot.files[0]);prev.style.display="block"}}}
function fixture(f,i){return `<div class=fixture><span><b>${f.teamA}</b> vs <b>${f.teamB}</b></span><button class="btn soft" onclick="useFixture(${i})">Analyze</button></div>`}
function useFixture(i){ta.value=S.fixtures[i].teamA;tb.value=S.fixtures[i].teamB;window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
async function ocr(){let f=shot.files[0];if(!f)return;ocrmsg.textContent="Reading screenshot…";try{let image=await dataURL(f);let local=await Tesseract.recognize(f,"eng",{logger:m=>{if(m.status==="recognizing text")ocrmsg.textContent="OCR "+Math.round(m.progress*100)+"%"}});let d=await api("/api/ocr",{method:"POST",body:JSON.stringify({text:local.data.text,imageData:image})});S.fixtures=d.fixtures;ocrmsg.textContent=`${d.method}: ${S.fixtures.length} fixtures found`;document.getElementById("fixtures").innerHTML=S.fixtures.length?S.fixtures.map((x,i)=>fixture(x,i)).join(""):"No fixtures found. Try a clearer screenshot."}catch(e){ocrmsg.textContent=e.message}}
function dataURL(f){return new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function predict(e){e.preventDefault();try{let d=await api("/api/predict",{method:"POST",body:JSON.stringify({teamA:ta.value,teamB:tb.value,market:market.value})});predmsg.innerHTML=`<div class=msg><b>${d.prediction.teamA} vs ${d.prediction.teamB}</b><br>Pick: <b>${d.prediction.prediction}</b> · Confidence estimate: <b>${d.prediction.confidence}%</b><br>${d.prediction.reason}<br><small>Odds used: ${d.prediction.oddsUsed}</small></div>`}catch(x){predmsg.textContent=x.message}}
async function pay(e){e.preventDefault();try{let d=await api("/api/payment",{method:"POST",body:JSON.stringify({reference:ref.value})});paymsg.textContent=d.message}catch(x){paymsg.textContent=x.message}}
async function history(){if(!S.user)return home();let d=await api("/api/history");app.innerHTML=`<div class=card><h2>🏆 Prediction History</h2><table><tr><th>Game</th><th>Pick</th><th>Confidence</th><th>Result</th><th>Status</th></tr>${d.predictions.map(p=>`<tr><td>${p.teamA} vs ${p.teamB}</td><td>${p.prediction}</td><td>${p.confidence}%</td><td>${p.actualScore||"—"}</td><td class=${p.status.toLowerCase()}>${p.status}</td></tr>`).join("")}</table></div>`}
async function admin(){if(!S.user)return home();try{let d=await api("/api/admin");app.innerHTML=`<section class=hero><h1>🔐 Admin Panel</h1><p>Admin account is free and has full control.</p></section><div class=grid><div class=card><div class=muted>Users</div><div class=stat>${d.users.length}</div></div><div class=card><div class=muted>Payments</div><div class=stat>${d.payments.length}</div></div><div class=card><div class=muted>Predictions</div><div class=stat>${d.predictions.length}</div></div></div><div class=card><h2>💰 Payments</h2><table><tr><th>User</th><th>Amount</th><th>Reference</th><th>Status</th><th></th></tr>${d.payments.map(p=>`<tr><td>${(d.users.find(u=>u.id===p.userId)||{}).email||""}</td><td>TSh ${p.amount.toLocaleString()}</td><td>${p.reference}</td><td>${p.status}</td><td>${p.status==="pending"?`<button class="btn blue" onclick="payAction('${p.id}','approved')">Approve</button> <button onclick="payAction('${p.id}','rejected')">Reject</button>`:"—"}</td></tr>`).join("")}</table></div><div class=card><h2>🏆 Verify Prediction Results</h2><table><tr><th>Game</th><th>Pick</th><th>Status</th><th>Score A</th><th>Score B</th><th></th></tr>${d.predictions.map(p=>`<tr><td>${p.teamA} vs ${p.teamB}</td><td>${p.prediction}</td><td>${p.status}</td><td><input id=a_${p.id} type=number min=0></td><td><input id=b_${p.id} type=number min=0></td><td><button onclick="result('${p.id}','WIN')">WIN</button><button onclick="result('${p.id}','LOSS')">LOSS</button></td></tr>`).join("")}</table></div><div class=card><h2>⚙️ Payment / Subscription Settings</h2><form onsubmit="settings(event)"><label>Price (TSh)</label><input id=price type=number value=${d.settings.priceTsh}><label>Subscription days</label><input id=days type=number value=${d.settings.subscriptionDays}><label>Payment method</label><input id=pm value="${esc(d.settings.paymentMethod)}"><label>Payment number</label><input id=pn value="${esc(d.settings.paymentNumber)}"><label>Payment name</label><input id=pp value="${esc(d.settings.paymentName)}"><label>Instructions</label><textarea id=pi>${esc(d.settings.paymentInstructions)}</textarea><button class="btn blue">Save</button></form></div></div>`}catch(x){app.innerHTML=`<div class=card><h2>Admin</h2><p>${x.message}</p></div>`}}
function esc(x){return String(x||"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
async function payAction(id,status){await api("/api/admin",{method:"POST",body:JSON.stringify({action:"payment",id,status})});admin()}
async function result(id,status){await api("/api/admin",{method:"POST",body:JSON.stringify({action:"result",id,status,scoreA:document.getElementById("a_"+id).value,scoreB:document.getElementById("b_"+id).value,actualScore:document.getElementById("a_"+id).value+"-"+document.getElementById("b_"+id).value})});admin()}
async function settings(e){e.preventDefault();await api("/api/admin",{method:"POST",body:JSON.stringify({action:"settings",settings:{priceTsh:Number(price.value),subscriptionDays:Number(days.value),paymentMethod:pm.value,paymentNumber:pn.value,paymentName:pp.value,paymentInstructions:pi.value}})});alert("Saved");boot()}
boot();
</script></body></html>
