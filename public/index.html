<main id="app"></main>

<script>

let S={
user:null,
settings:null,
ai:false,
fixtures:[],
historicalResults:[]
};

const $=x=>document.getElementById(x);


/* =========================
   API
========================= */

async function api(p,o={}){
let r=await fetch(p,{
headers:{"Content-Type":"application/json"},
...o
});

let d;

try{
d=await r.json();
}catch(e){
throw Error("Server returned an invalid response");
}

if(!r.ok)throw Error(d.error||"Request failed");

return d;
}


/* =========================
   BOOT
========================= */

async function boot(){

try{

let d=await api("/api/config");

S.user=d.user;
S.settings=d.settings;
S.ai=d.aiEnabled;

loadHistoricalLocal();

go(S.user?"dashboard":"home");

}catch(e){

console.error(e);

app.innerHTML=`
<div class="card">
<h2>Connection Error</h2>
<p>${esc(e.message)}</p>
</div>
`;

}

}


/* =========================
   NAVIGATION
========================= */

function go(p){

if(p==="home")home();
else if(p==="dashboard")dashboard();
else if(p==="history")history();
else if(p==="admin")admin();

}


/* =========================
   HOME
========================= */

Analysis → Prediction → Verified result history.

</p>

<input id="lp" type="password" placeholder="Password" required>

</form>

<input id="re" type="email" placeholder="Email" required>

   LOGIN
========================= */

/* =========================
   OCR
========================= */

async function ocr(){

let f=shot.files[0];

if(!f)return;

ocrmsg.textContent="Reading screenshot…";

try{

let image=await dataURL(f);

let local=await Tesseract.recognize(
f,
"eng",
{
logger:m=>{

if(m.status==="recognizing text"){

ocrmsg.textContent=
"OCR "+Math.round(m.progress*100)+"%";

}

}
}
);

let d=await api("/api/ocr",{
method:"POST",
body:JSON.stringify({
text:local.data.text,
imageData:image
})
});

S.fixtures=d.fixtures;

ocrmsg.textContent=
`${d.method}: ${S.fixtures.length} fixtures found`;

document.getElementById("fixtures").innerHTML=

S.fixtures.length?

S.fixtures.map((x,i)=>fixture(x,i)).join(""):

"No fixtures found. Try a clearer screenshot.";

}catch(e){

ocrmsg.textContent=e.message;

}

}


/* =========================
   DATA URL
========================= */

function dataURL(f){

return new Promise((ok,no)=>{

let r=new FileReader();

r.onload=()=>ok(r.result);

r.onerror=no;

r.readAsDataURL(f);

});

}

/* =========================================================
   HISTORICAL RESULTS
========================================================= */


/*
Expected CSV:

date,teamA,teamB,scoreA,scoreB

Example:

2026-09-17,Barcelona,Real Madrid,2,1
2026-09-16,Arsenal,Chelsea,3,0
*/


function importHistoricalResults(){

let file=document.getElementById("historyFile").files[0];

if(!file){

historicalMsg.innerHTML=
`<div class="warning">Please choose a CSV file first.</div>`;

return;

}

if(!file.name.toLowerCase().endsWith(".csv")){

historicalMsg.innerHTML=
`<div class="warning">Please select a CSV file.</div>`;

return;

}

let reader=new FileReader();

reader.onload=async function(e){

try{

let text=e.target.result;

let rows=parseCSV(text);

if(rows.length<2){

throw Error("CSV file does not contain enough data.");

}

let headers=rows[0].map(x=>x.trim().toLowerCase());

let required=[
"teamA".toLowerCase(),
"teamB".toLowerCase(),
"scoreA".toLowerCase(),
"scoreB".toLowerCase()
];

let missing=required.filter(x=>!headers.includes(x));

if(missing.length){

throw Error(
"Missing columns: "+missing.join(", ")
);

}

let imported=[];

for(let i=1;i<rows.length;i++){

let row=rows[i];

if(!row.length)continue;

let obj={};

headers.forEach((h,index)=>{
obj[h]=row[index]||"";
});

let teamA=
obj.teama||
obj["team a"]||
"";

let teamB=
obj.teamb||
obj["team b"]||
"";

let scoreA=
Number(obj.scorea);

let scoreB=
Number(obj.scoreb);

if(!teamA||!teamB||
Number.isNaN(scoreA)||
Number.isNaN(scoreB)){

continue;

}

imported.push({

date:obj.date||"",
teamA:teamA.trim(),
teamB:teamB.trim(),
scoreA:scoreA,
scoreB:scoreB

});

}

if(!imported.length){

throw Error(
"No valid historical results were found."
);

}


/* Avoid duplicate results */

let existing=loadHistoricalLocal();

let combined=[
...existing,
...imported
];

let unique=[];

let keys=new Set();

combined.forEach(r=>{

let key=[
r.date,
r.teamA.toLowerCase(),
r.teamB.toLowerCase(),
r.scoreA,
r.scoreB
].join("|");

if(!keys.has(key)){

keys.add(key);
unique.push(r);

}

});

S.historicalResults=unique;

saveHistoricalLocal();


/* Try sending data to backend */

let backendMessage="";

try{

let response=await api(
"/api/historical-results",
{
method:"POST",
body:JSON.stringify({
results:imported
})
}
);

backendMessage=
response.message||
"Historical results sent to server.";

}catch(serverError){

backendMessage=
"Saved locally. Backend endpoint /api/historical-results is not available yet.";

}


historicalMsg.innerHTML=`

<div class="success">

<strong>Import successful.</strong><br>

Imported:
<b>${imported.length}</b> results.<br>

Total stored:
<b>${S.historicalResults.length}</b> results.<br>

<span class="small">
${backendMessage}
</span>

</div>

`;

renderHistoricalResults();

}catch(err){

historicalMsg.innerHTML=`

<div class="warning">

Import failed:
<b>${esc(err.message)}</b>

</div>

`;

}

};

reader.readAsText(file);

}


/* =========================
   CSV PARSER
========================= */

function parseCSV(text){

let rows=[];

let row=[];

let cell="";

let insideQuotes=false;

for(let i=0;i<text.length;i++){

let c=text[i];

if(c==='"'){

if(insideQuotes && text[i+1]==='"'){

cell+='"';
i++;

}else{

insideQuotes=!insideQuotes;

}

}else if(c===','&&!insideQuotes){

row.push(cell.trim());
cell="";

}else if((c==="\n"||c==="\r")&&!insideQuotes){

if(c==="\r"&&text[i+1]==="\n")i++;

row.push(cell.trim());

if(row.some(x=>x!==""))rows.push(row);

row=[];
cell="";

}else{

cell+=c;

}

}

if(cell!==""||row.length){

row.push(cell.trim());

if(row.some(x=>x!==""))rows.push(row);

}

return rows;

}


/* =========================
   LOCAL STORAGE
========================= */

function historicalStorageKey(){

let email=S.user&&S.user.email?
S.user.email:
"guest";

return "instantVirtualPredictorHistorical_"+email;

}


function saveHistoricalLocal(){

try{

localStorage.setItem(
historicalStorageKey(),
JSON.stringify(S.historicalResults)
);

}catch(e){

console.error(e);

}

}


function loadHistoricalLocal(){

try{

let raw=localStorage.getItem(
historicalStorageKey()
);

S.historicalResults=
raw?JSON.parse(raw):[];

return S.historicalResults;

}catch(e){

S.historicalResults=[];

return [];

}

}


/* =========================
   DISPLAY HISTORICAL DATA
========================= */

function renderHistoricalResults(){

let box=document.getElementById(
"historicalPreview"
);

if(!box)return;

if(!S.historicalResults.length){

box.innerHTML=`

<div class="history-empty">

No historical results imported yet.

</div>

`;

return;

}

let rows=S.historicalResults
.slice()
.reverse()
.map(r=>`

<tr>

<td>${esc(r.date||"—")}</td>

<td>${esc(r.teamA)}</td>

<td>${esc(r.teamB)}</td>

<td>${r.scoreA}</td>

<td>${r.scoreB}</td>

<td>

${
r.scoreA>r.scoreB?
'<span class="win">HOME WIN</span>':
r.scoreA<r.scoreB?
'<span class="loss">AWAY WIN</span>':
'<span class="pending">DRAW</span>'
}

</td>

</tr>

`).join("");

box.innerHTML=`

<h3>
Imported Results
<span class="badge">
${S.historicalResults.length}
</span>
</h3>

<div class="history-box">

<table>

<thead>

<tr>

<th>Date</th>
<th>Team A</th>
<th>Team B</th>
<th>A</th>
<th>B</th>
<th>Result</th>

</tr>

</thead>

<tbody>

${rows}

</tbody>

</table>

</div>

`;

}


/* =========================
   CLEAR HISTORICAL RESULTS
========================= */

async function clearHistoricalResults(){

if(!S.historicalResults.length){

alert("There are no historical results to clear.");

return;

}

if(!confirm(
"Are you sure you want to clear all imported historical results?"
))return;

S.historicalResults=[];

localStorage.removeItem(
historicalStorageKey()
);


/* Try clearing backend too */

try{

await api(
"/api/historical-results",
{
method:"DELETE"
}
);

}catch(e){

/*
Backend endpoint may not exist yet.
Local data is still cleared.
*/

}

historicalMsg.innerHTML=`

<div class="success">

Historical results cleared successfully.

</div>

`;

renderHistoricalResults();

}

/* =========================
   ESCAPE HTML
========================= */

function esc(x){

return String(x||"")
.replaceAll("&","&amp;")
.replaceAll('"',"&quot;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");

}


/* =========================
   ADMIN PAYMENT
========================= */

async function payAction(id,status){

await api("/api/admin",{

method:"POST",

body:JSON.stringify({
action:"payment",
id,
status
})

});

admin();

}


/* =========================
   ADMIN RESULT
========================= */

async function result(id,status){

await api("/api/admin",{

method:"POST",

body:JSON.stringify({

action:"result",
id,
status,

scoreA:
document.getElementById("a_"+id).value,

scoreB:
document.getElementById("b_"+id).value,

actualScore:
document.getElementById("a_"+id).value+
"-"+
document.getElementById("b_"+id).value

})

});

admin();

}


/* =========================
   SETTINGS
========================= */

async function settings(e){

e.preventDefault();

await api("/api/admin",{

method:"POST",

body:JSON.stringify({

action:"settings",

settings:{

priceTsh:Number(price.value),

subscriptionDays:
Number(days.value),

paymentMethod:pm.value,

paymentNumber:pn.value,

paymentName:pp.value,

paymentInstructions:pi.value

}

})

});

alert("Saved");

boot();

}


/* =========================
   START
========================= */

boot();

</script>
